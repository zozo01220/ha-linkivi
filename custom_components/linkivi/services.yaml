show_message:
  target:
    entity:
      integration: linkivi
  fields:
    title:
      example: "Un visiteur est à l'accueil"
      selector:
        text:
    message:
      example: "Merci d'aller l'accueillir"
      selector:
        text:
          multiline: true
    look:
      default: information
      selector:
        select:
          translation_key: look
          options:
            - information
            - attention
    blur:
      default: false
      selector:
        boolean:
    duration:
      example: 30
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: s
          mode: box
    wake:
      default: false
      selector:
        boolean:
    place:
      default: full
      selector:
        select:
          translation_key: place
          options:
            - full
            - banner
            - banner_top
            - corner
    corner:
      default: bottom_right
      selector:
        select:
          translation_key: corner
          options:
            - bottom_right
            - bottom_left
            - top_right
            - top_left
    camera:
      selector:
        entity:
          domain: camera
    image_url:
      example: "https://example.com/image.jpg"
      selector:
        text:
          type: url
    live:
      default: false
      selector:
        boolean:
    tag:
      example: "doorbell"
      selector:
        text:
    countdown_to:
      example: "2026-11-23 19:10:42"
      selector:
        datetime:
    paused:
      default: false
      selector:
        boolean:
    more:
      default: 0
      selector:
        number:
          min: 0
          max: 9
          mode: box
    ended_message:
      example: "dites « Alexa, stop »"
      selector:
        text:

clear_display:
  target:
    entity:
      integration: linkivi
  fields:
    tag:
      example: "minuteur-alexa"
      selector:
        text:

show_list:
  target:
    entity:
      integration: linkivi
  fields:
    playlist:
      required: true
      example: "Accueil"
      selector:
        text:

start_emergency:
  target:
    entity:
      integration: linkivi
  fields:
    title:
      required: true
      example: "Évacuation"
      selector:
        text:
    message:
      example: "Quittez le bâtiment par les issues de secours."
      selector:
        text:
          multiline: true

end_emergency:
