blueprint:
  name: Linkivi – Batterie d'une tablette murale entre 20 et 80 %
  description: >-
    Une tablette toujours branchée finit par gonfler. Cette automatisation allume la prise connectée du chargeur
    quand la batterie descend sous le seuil bas, et la coupe au-dessus du seuil haut.
  domain: automation
  source_url: https://github.com/zozo01220/ha-linkivi/blob/main/blueprints/automation/linkivi/batterie-tablette.yaml
  input:
    battery:
      name: Batterie
      description: Le capteur « Batterie » de l'écran Linkivi (smartphones et tablettes Android).
      selector:
        entity:
          integration: linkivi
          domain: sensor
          device_class: battery
    plug:
      name: Prise du chargeur
      selector:
        entity:
          domain: switch
    low:
      name: Seuil bas (allumer la charge)
      default: 20
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: "%"
    high:
      name: Seuil haut (couper la charge)
      default: 80
      selector:
        number:
          min: 40
          max: 100
          unit_of_measurement: "%"

mode: single

triggers:
  - trigger: numeric_state
    entity_id: !input battery
    below: !input low
    id: charge
  - trigger: numeric_state
    entity_id: !input battery
    above: !input high
    id: stop

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: charge
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input plug
      - conditions:
          - condition: trigger
            id: stop
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input plug
