blueprint:
  name: Linkivi – Minuteur Alexa sur les écrans
  description: >-
    « Alexa, mets un minuteur de 10 minutes » : le minuteur s'affiche sur les écrans choisis, au choix dans le bandeau du haut, le bandeau du bas (pris, ou ajouté
    le temps du minuteur) ou en plein écran sur fond noir, compte jusqu'à zéro, clignote en rouge pendant qu'Alexa sonne, puis disparaît au « Alexa, stop ».
    Demande l'intégration Alexa Media Player (capteur « Prochain minuteur » de l'Alexa). Une automatisation par Alexa.
  domain: automation
  source_url: https://github.com/zozo01220/ha-linkivi/blob/main/blueprints/automation/linkivi/minuteur-alexa.yaml
  input:
    timer:
      name: Minuteurs de l'Alexa
      description: Capteur « Prochain minuteur » de l'Alexa (Alexa Media Player), par exemple sensor.sejour_prieur_echo_prochain_minuteur.
      selector:
        entity:
          filter:
            - integration: alexa_media
              domain: sensor
    screens:
      name: Écrans
      selector:
        target:
          entity:
            integration: linkivi
    alexa_name:
      name: Nom de l'Alexa affiché
      description: En petit, sous le titre (le titre est le nom donné au minuteur, sinon « Minuteur »).
      default: Alexa du séjour
      selector:
        text:
    place:
      name: Où afficher le minuteur
      description: Le contenu de l'écran revient tel quel quand le minuteur est arrêté. Le plein écran masque le contenu pendant tout le minuteur.
      default: banner_top
      selector:
        select:
          options:
            - label: Bandeau du haut
              value: banner_top
            - label: Bandeau du bas
              value: banner_bottom
            - label: Plein écran, fond noir
              value: full
    ring_full:
      name: Plein écran à la sonnerie seulement
      description: >-
        Bandeau pendant le décompte (celui du choix ci-dessus), puis plein écran rouge clignotant quand Alexa sonne.
        Sans effet si « Plein écran » est déjà choisi.
      default: false
      selector:
        boolean:
    ended:
      name: Texte une fois fini
      default: dites « Alexa, stop »
      selector:
        text:
    keep:
      name: Rouge à la fin, au plus
      description: >-
        Si Alexa Media Player retire le minuteur dès qu'il sonne (sans attendre « Alexa, stop »), le rouge reste ce temps-là.
      default:
        minutes: 1
      selector:
        duration:

mode: restart
max_exceeded: silent

# changement du capteur (son état : la fin du prochain minuteur ; ses attributs : les minuteurs en cours), et redémarrage de Home Assistant
triggers:
  - trigger: state
    entity_id: !input timer
  - trigger: homeassistant
    event: start

variables:
  timer: !input timer
  place: !input place
  ring_full: !input ring_full
  alexa_name: !input alexa_name
  brief: "{{ state_attr(timer, 'brief') }}"
  active: "{{ brief.active if brief is mapping and brief.active is defined and brief.active is iterable else [] }}"
  running: "{{ (states(timer) | as_datetime(None)) is not none or (active | count) > 0 }}"
  # signature : on ne renvoie rien si seule l'heure du dernier relevé a changé
  sig_new: "{{ states(timer) }}|{{ active | map(attribute='status') | join(',') }}|{{ active | map(attribute='label') | join(',') }}"
  sig_old: >-
    {% if trigger.platform == 'state' and trigger.from_state is not none %}
      {% set b = trigger.from_state.attributes.brief %}
      {% set a = b.active if b is mapping and b.active is defined and b.active is iterable else [] %}
      {{ trigger.from_state.state }}|{{ a | map(attribute='status') | join(',') }}|{{ a | map(attribute='label') | join(',') }}
    {% else %}-{% endif %}

conditions:
  - condition: template
    value_template: "{{ sig_new != sig_old | trim }}"

actions:
  - choose:
      - conditions: "{{ running }}"
        sequence:
          - variables:
              first: "{{ active[0] if (active | count) > 0 else {} }}"
              paused: "{{ (first.status | default('')) == 'PAUSED' }}"
              left_ms: "{{ first.remainingTime | default(0) | int(0) }}"
              end: >-
                {% set e = states(timer) | as_datetime(None) %}{% if paused or e is none %}{{ (now() + timedelta(milliseconds=left_ms)).isoformat() }}{% else %}{{ e.isoformat() }}{% endif %}
              label: "{{ (first.label | default('')) or '' }}"
              more: "{{ [(active | count) - 1, 0] | max }}"
              second: "{{ (active[1].label | default('')) if (active | count) > 1 else '' }}"
          - action: linkivi.show_message
            continue_on_error: true   # écran hors ligne ou en veille : on n'arrête pas l'automatisation
            target: !input screens
            data:
              title: "{{ label | capitalize if label else 'Minuteur' }}"
              message: "{{ ('puis ' ~ second) if second else alexa_name }}"
              place: !input place
              countdown_to: "{{ end }}"
              paused: "{{ paused }}"
              more: "{{ more }}"
              ended_message: !input ended
              tag: minuteur-alexa
          # « plein écran à la sonnerie » : on attend la fin du minuteur, puis le même message passe en plein écran (rouge clignotant)
          - if: "{{ ring_full and place != 'full' and not paused }}"
            then:
              - delay:
                  seconds: "{{ [(as_datetime(end) - now()).total_seconds(), 0] | max | int }}"
              - action: linkivi.show_message
                continue_on_error: true
                target: !input screens
                data:
                  title: "{{ label | capitalize if label else 'Minuteur' }}"
                  message: "{{ alexa_name }}"
                  place: full
                  countdown_to: "{{ end }}"
                  more: "{{ more }}"
                  ended_message: !input ended
                  tag: minuteur-alexa
    default:
      # plus de minuteur : « Alexa, stop », annulé, ou retiré dès la sonnerie (on garde alors le rouge un moment)
      - variables:
          rang: >-
            {% set e = trigger.from_state.state | as_datetime(None) if trigger.platform == 'state' and trigger.from_state is not none else none %}
            {{ e is not none and ((now() - e).total_seconds() | abs) < 20 }}
      - if: "{{ rang }}"
        then:
          - if: "{{ ring_full and place != 'full' }}"
            then:
              - action: linkivi.show_message
                continue_on_error: true
                target: !input screens
                data:
                  title: Minuteur
                  message: "{{ alexa_name }}"
                  place: full
                  countdown_to: "{{ trigger.from_state.state }}"
                  ended_message: !input ended
                  tag: minuteur-alexa
          - delay: !input keep
      - action: linkivi.clear_display
        continue_on_error: true
        target: !input screens
        data:
          tag: minuteur-alexa
