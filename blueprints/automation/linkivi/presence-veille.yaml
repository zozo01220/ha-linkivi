blueprint:
  name: Linkivi – Écran allumé seulement quand il y a quelqu'un
  description: >-
    L'écran se rallume dès qu'un détecteur de présence ou de mouvement voit quelqu'un, et se met en veille
    quand la pièce est vide depuis un moment. Économies d'énergie, et pas de marquage de l'écran.
  domain: automation
  source_url: https://github.com/zozo01220/ha-linkivi/blob/main/blueprints/automation/linkivi/presence-veille.yaml
  input:
    presence:
      name: Présence
      description: Détecteur de présence, de mouvement ou d'occupation (« on » = quelqu'un).
      selector:
        entity:
          domain: [binary_sensor, input_boolean]
    screen:
      name: Écran
      description: L'interrupteur « Écran » de l'écran Linkivi.
      selector:
        entity:
          integration: linkivi
          domain: switch
          multiple: true
    empty_for:
      name: Mise en veille après
      default:
        minutes: 10
      selector:
        duration:

mode: restart

triggers:
  - trigger: state
    entity_id: !input presence
    to: "on"
    id: here
  - trigger: state
    entity_id: !input presence
    to: "off"
    for: !input empty_for
    id: empty

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: here
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input screen
      - conditions:
          - condition: trigger
            id: empty
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input screen
